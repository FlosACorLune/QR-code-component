<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    .qr-code {
      box-sizing: border-box;
      margin: 100px auto 0 auto;
      padding: 16px;
      background-color: #FFFFFF;
      width: 320px;
      height: 500px;
      border-radius: 20px;
    }

    body {
      background-color: #d5e1ef;
      font-family: outfit;
    }

    .qr-code-content {
      text-align: center;
      margin: 0 16px;
    }

    .text-set-1 {
      font-size: 22px;
      font-weight: 700;
      color: #1f314f;
    }

    .text-set-2 {
      font-size: 15px;
      font-weight: 400;
      color: #68778d;
    }

    .qr-code-img {
      height: 60%;
    }
    .qr-code-img img {
      height: 100%;
      width: 100%;
      border-radius: 10px;
    }

  </style>
</head>
<body>

  <div class="qr-code">
    <div class="qr-code-img">
      <img src="./images/image-qr-code.png" alt="qr-code" height="144" width="144">
    </div>
    <div class="qr-code-content">
        <p class="text-set-1">Improve your front-end skills by building projects</p>
        <p class="text-set-2">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </div>

  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
